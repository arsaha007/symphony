apiVersion: fabric.symphony/v1
kind: Target
metadata:
  name: remote-demom
spec:
  displayName: remote-demo
  components:
  - name: remote-agent
    type: remote-agent
    properties:
      description: this is a demo remote agent
  - name: docker
    type: docker
    properties:
      container.ports: '{"9090/tcp":[{"HostIP":"0.0.0.0","HostPort":"9090"}]}'
      container.imagePullPolicy: "Always"
      container.resources: "{\"requests\":{\"cpu\":\"100m\",\"memory\":\"100Mi\"}}"        
      container.image: "prom/prometheus"
  topologies:
  - bindings:
    - provider: providers.target.docker
      role: docker
    - provider: providers.target.remote-agent
      role: remote-agent
